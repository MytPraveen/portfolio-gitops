apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
  namespace: portfolio-production
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: portfolio-backend
  template:
    metadata:
      labels:
        app: portfolio-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "portfolio-backend"
        vault.hashicorp.com/agent-extra-secret: "vault-ca"
        vault.hashicorp.com/ca-cert: "/vault/custom/ca.crt"
        vault.hashicorp.com/agent-inject-secret-db.json: "database/creds/portfolio-role"
        vault.hashicorp.com/agent-inject-template-db.json: |
          {{- with secret "database/creds/portfolio-role" -}}
          {"username":{{ .Data.username | toJSON }},"password":{{ .Data.password | toJSON }}}
          {{- end }}
    spec:
      # ADD THIS LINE
      serviceAccountName: portfolio-backend-sa

      imagePullSecrets:
        - name: nexus-secret

      terminationGracePeriodSeconds: 30

      containers:
      - name: portfolio-backend
        image: registry.praveeninfra.online/docker-private/portfolio-backend:build-6
        ports:
        - containerPort: 8000

        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: UPLOAD_DIR
          value: "/uploads"

        volumeMounts:
        - name: uploads
          mountPath: /uploads

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15

        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]

      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: blog-uploads-pvc
